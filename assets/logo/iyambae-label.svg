<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="IYAMBAE">
<title>IYAMBAE</title>
<desc>Das Sonnenrad, ausgerichtet auf den blauen Punkt im Wirbel der Spirale.
Auf dem Plattenteller faellt dieser Punkt mit der Drehachse zusammen — er wird
zur Spindel, auf der die Platte sitzt.</desc>
<image x="0" y="0" width="512" height="512" href="data:image/png;base64,"/>
</svg>
