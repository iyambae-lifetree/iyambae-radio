<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>IYAMBAE-Tuner-Anbindung prüfen</title>
<!--
  Ein Werkzeug, keine Seite: Es prueft, ob der lokale Endpunkt des Tuners
  antwortet. Beim Aufraeumen am 05.09.2026 gefunden — oeffentlich
  erreichbar, indexierbar, auf Deutsch, und niemand verweist darauf. Wer es
  ueber eine Suchmaschine faende, stuende vor einer Fehlersuche fuer ein
  Programm, das er nicht hat.

  NUR noindex, KEIN Disallow in robots.txt: Eine gesperrte Seite wird nicht
  gelesen, also wird auch das noindex nicht gelesen — und ein bereits
  bekannter Verweis bliebe im Index stehen. Die beiden Anweisungen
  widersprechen einander; hier zaehlt die, die wirkt.
-->
<meta name="robots" content="noindex, nofollow">
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 44rem;
         margin: 2rem auto; padding: 0 1.2rem; line-height: 1.6; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  .kasten { padding: 1rem 1.2rem; border-radius: 10px; margin: 1rem 0; }
  .gut     { background: #e8f7ee; border: 1px solid #35a06a; }
  .schlecht{ background: #fdecec; border: 1px solid #d04545; }
  .warten  { background: #f4f4f6; border: 1px solid #ccc; }
  .titel { font-weight: 600; font-size: 1.05rem; }
  pre { background: #f6f6f8; padding: .8rem; border-radius: 8px; overflow-x: auto; font-size: .82rem; }
  .klein { color: #666; font-size: .88rem; }
  button { padding: .55rem 1.1rem; font-size: 1rem; border-radius: 8px;
           border: 1px solid #888; background: #fff; cursor: pointer; }
</style>
</head>
<body>
<h1>Kommt die Erkennung des IYAMBAE Tuners durch?</h1>
<p class="klein">Diese Seite fragt einmal <code>http://127.0.0.1:47432/status</code> ab und
sagt, was dabei herauskommt. Der IYAMBAE Tuner muss laufen.</p>

<div class="kasten warten" id="ergebnis">
  <div class="titel">Wird geprüft …</div>
</div>

<p><button onclick="pruefe()">Nochmal prüfen</button></p>

<div id="details"></div>

<script>
async function pruefe() {
  const kasten = document.getElementById('ergebnis');
  const details = document.getElementById('details');
  kasten.className = 'kasten warten';
  kasten.innerHTML = '<div class="titel">Wird geprüft …</div>';
  details.innerHTML = '';

  const begonnen = performance.now();
  try {
    const antwort = await fetch('http://127.0.0.1:47432/status', {
      cache: 'no-store',
      signal: AbortSignal.timeout(3000),
    });
    const daten = await antwort.json();
    const dauer = Math.round(performance.now() - begonnen);

    if (daten.app !== 'iyambae-tuner' && daten.app !== 'myretuner') {
      kasten.className = 'kasten schlecht';
      kasten.innerHTML = '<div class="titel">Da antwortet etwas anderes</div>' +
        '<p>Der Anschluss ist belegt, aber nicht vom IYAMBAE Tuner.</p>';
      return;
    }

    kasten.className = 'kasten gut';
    kasten.innerHTML = '<div class="titel">✓ Die Erkennung funktioniert in diesem Browser</div>' +
      '<p>Der IYAMBAE Tuner hat nach ' + dauer + ' ms geantwortet. Damit greift die automatische ' +
      'Erkennung auf der Radioseite — der Schalter springt von allein um.</p>';
    const einleitung = document.createElement('p');
    einleitung.className = 'klein';
    einleitung.textContent = 'Das hat die App geliefert:';

    /*
     textContent, nicht innerHTML. JSON.stringify maskiert nur die
     JSON-Metazeichen, nicht < > und &. Der <pre>-Kontext schützt dabei
     nicht — innerHTML wertet darin ganz normales Markup aus, ein
     <img onerror=…> würde feuern.

     Und diese Antwort ist Fremdtext: Auf Port 47432 antwortet, wer sich
     zuerst daran gebunden hat. Das muss nicht der IYAMBAE Tuner sein.
    */
    const rohtext = document.createElement('pre');
    rohtext.textContent = JSON.stringify(daten, null, 2);

    const erklaerung = document.createElement('p');
    erklaerung.className = 'klein';
    // Eigener Text, keine Interpolation — hier ist innerHTML unbedenklich.
    erklaerung.innerHTML = 'Wichtig ist <code>vertrauen</code>: ab 0,5 zeigt die ' +
      'Radioseite die gemessene Quellstimmung genau an, zwischen 0,15 und 0,5 ' +
      'gerundet mit „etwa", darunter gar nicht.';

    details.replaceChildren(einleitung, rohtext, erklaerung);
  } catch (fehler) {
    kasten.className = 'kasten schlecht';

    const titel = document.createElement('div');
    titel.className = 'titel';
    titel.textContent = '✗ Die Anfrage kam nicht durch';

    // fehler.message kann Text enthalten, der nicht von uns stammt.
    const fehlerZeile = document.createElement('p');
    const fehlerCode = document.createElement('code');
    fehlerCode.textContent = fehler.name + ': ' + fehler.message;
    fehlerZeile.append(fehlerCode);

    const einleitung = document.createElement('p');
    einleitung.textContent = 'Drei mögliche Gründe, in dieser Reihenfolge zu prüfen:';

    const liste = document.createElement('ol');

    const grund1 = document.createElement('li');
    grund1.innerHTML = '<b>Der IYAMBAE Tuner läuft nicht.</b> Starten und nochmal prüfen.';

    const grund2 = document.createElement('li');
    grund2.innerHTML = '<b>Du hast dieser Seite noch nichts erlaubt.</b> ' +
      'Die App fragt einmal je Herkunft nach; solange niemand zugestimmt hat, ' +
      'antwortet sie mit <code>403</code>. Schau in die Menüleiste — dort sollte ' +
      'die Rückfrage stehen. Aktuelle Herkunft: ';
    const herkunft = document.createElement('code');
    herkunft.textContent = location.origin;   // auch das lieber als Text
    grund2.append(herkunft);

    const grund3 = document.createElement('li');
    grund3.innerHTML = '<b>Der Browser hat die Erlaubnis für lokale Zugriffe ' +
      'verweigert.</b> Chrome fragt seit Version 142 den Nutzer, statt den Server ' +
      'entscheiden zu lassen. Wurde der Dialog weggeklickt, kommt die Anfrage nicht ' +
      'einmal bei der App an. In der Konsole (Rechtsklick → Untersuchen → Console) ' +
      'steht dann etwas über „local network access".';

    liste.append(grund1, grund2, grund3);
    kasten.replaceChildren(titel, fehlerZeile, einleitung, liste);
  }
}
pruefe();
</script>
</body>
</html>
