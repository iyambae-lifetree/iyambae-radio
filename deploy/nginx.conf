# nginx für IYAMBAE — zwei Hostnamen, ein Container.
#
# iyambae.fm und www.iyambae.fm  → das Radio
# apps.iyambae.fm                → die Seite für die Apps
#
# Läuft als nginx-unprivileged auf Port 8080: kein root im Container.

# ── MIME-Typen, die nginx von Haus aus nicht kennt ──────────────────
#
# Ohne diesen Block liefert nginx .mjs als application/octet-stream aus.
# Der Browser lehnt das für ein ES-Modul strikt ab ("Failed to load module
# script: Expected a JavaScript module script but the server responded with
# a MIME type of ..."), und die App startet gar nicht. Fünf der sechs
# Dateien unter assets/lib/ sind .mjs — es fällt also sofort alles aus.
# Nur die zwei, die dem Basisabbild wirklich fehlen. webp, woff2 und wasm
# stehen in dessen mime.types (nachgesehen, Zeilen 23/29/55); sie hier noch
# einmal anzugeben ergibt beim Start eine Warnung und sonst nichts.
types {
    application/javascript              mjs;
    application/manifest+json           webmanifest;
}

map $sent_http_content_type $cache_regel {
    default                             "public, max-age=3600";
    # Der Service Worker und die Einstiegsseite entscheiden, was der Besucher
    # sieht. Werden sie zwischengespeichert, bleibt eine neue Fassung
    # unsichtbar — genau der Fehler, gegen den SW_VERSION hochgezählt wird.
    "text/html"                         "no-cache";
    "application/manifest+json"         "no-cache";
}

# ── Spracherkennung an der Wurzel ───────────────────────────────────
#
# Sieben Sprachen, sieben Adressen: /de/ /en/ /fr/ /es/ /it/ /ja/ /ar/.
# Wer / aufruft, wird anhand seines Browsers dorthin geschickt und muss
# nichts einstellen.
#
# ENTSCHEIDEND, UND ES IST DIE HÄLFTE DER SACHE: Umgeleitet wird NUR von /.
# Niemals von einem Sprachpfad weg. Wer /en/ öffnet, bekommt Englisch — auch
# mit deutschem Browser, auch wenn er letzte Woche /de/ gelesen hat. Sonst:
#
#   - Ein geteilter Verweis verliert seine Sprache. Jemand schickt
#     iyambae.fm/en/ in einen deutschen Gruppenchat, und die Empfänger sehen
#     Deutsch — der Absender kann nicht mehr zeigen, was er meinte.
#   - Googlebot krabbelt aus den USA mit "Accept-Language: en" oder ganz ohne.
#     Wer ihn überall umleitet, bekommt sechs Sprachen nie in den Index.
#   - Wer im Ausland arbeitet, hat oft einen englischen Browser und will
#     trotzdem Deutsch lesen. Ein Umschalter, gegen den die Seite anrennt,
#     ist kein Umschalter.
#
# Accept-Language ist eine gewichtete Liste ("de-DE,de;q=0.9,en;q=0.8"). Wir
# lesen nur den ERSTEN Eintrag. Das ist bewusst grob: Der erste Eintrag ist
# die bevorzugte Sprache, und für eine Erstzuweisung, die jeder mit einem
# Klick ändern kann, ist mehr Aufwand nicht gerechtfertigt.
map $http_accept_language $sprache_vom_browser {
    default    en;
    "~*^\s*de" de;
    "~*^\s*en" en;
    "~*^\s*fr" fr;
    "~*^\s*es" es;
    "~*^\s*it" it;
    "~*^\s*ja" ja;
    "~*^\s*ar" ar;
}

# Eine getroffene Wahl schlägt den Browser. Der Umschalter setzt dieses
# Plätzchen (assets/lib/sprache.mjs), localStorage könnte der Server nicht
# lesen. Wer einmal auf Japanisch umgestellt hat, landet auch dann auf /ja/,
# wenn sein Browser Deutsch meldet.
map $cookie_hz_sprache $sprache_gewaehlt {
    default "";
    "~^(de|en|fr|es|it|ja|ar)$" $cookie_hz_sprache;
}

map $sprache_gewaehlt $sprache {
    default   $sprache_gewaehlt;
    ""        $sprache_vom_browser;
}

# Warum diese Sprachen und keine anderen: Die Weiche unten steht in einem
# regulären Ausdruck, und ein Pfad, der hier nicht steht, fällt in die
# normale Auslieferung — also 404 statt einer stillen Fehlleitung.

# ── Zugriffsprotokoll mit verringertem Personenbezug ────────────────
#
# nginx protokolliert standardmäßig die volle Besucheradresse. Bei einer
# deutschen Seite ist das der klassische Stolperstein: Eine IP-Adresse ist ein
# personenbezogenes Datum, und dreißig Tage Aufbewahrung in Log Analytics
# lassen sich für Reichweitenmessung schwer begründen.
#
# Deshalb wird das letzte Oktett auf Null gesetzt, bevor überhaupt etwas
# geschrieben wird. Für die Statistik — wie viele Besuche, welches Land,
# welcher Browser — ändert das nichts.
#
# Was es NICHT tut: die Zeile anonym machen. Eine gekürzte Adresse zusammen
# mit Zeitpunkt, Browserkennung und Verweisquelle kann im Einzelfall immer
# noch auf eine Person zurückführen. Der Personenbezug wird so weit
# verringert, wie es ohne Verlust der Betriebsauswertung geht — mehr
# verspricht diese Zeile nicht, und die Datenschutzerklärung verspricht es
# auch nicht: Sie behandelt die Protokolle weiterhin als personenbezogene
# Daten und stützt sie auf Art. 6 Abs. 1 lit. f DSGVO.
#
# Achtung bei der Quelle: Hinter Container Apps steht ein Proxy. `$remote_addr`
# ist dessen interne Adresse (100.100.x.x) und wertlos; die echte
# Besucheradresse steht in X-Forwarded-For.
# WELCHER EINTRAG — das ist keine Feinheit, sondern der ganze Punkt.
#
# X-Forwarded-For ist eine Liste, und der Browser darf sie selbst
# mitschicken. Der Ingress von Container Apps (Envoy) HÄNGT die Adresse,
# die er tatsächlich gesehen hat, HINTEN AN. Der erste Eintrag ist also
# alles, was der Absender hineinschreiben wollte; der letzte ist der, den
# die Plattform selbst geschrieben hat.
#
# Diese Karte nahm bis hierher den ERSTEN. Am 21.08.2026 nachgemessen:
# eine Anfrage an https://iyambae.fm/de/ mit selbst gesetztem
# `X-Forwarded-For: 203.0.113.77` stand als Besucher "203.0.113.0" im
# Protokoll, die echte Adresse nirgends. Damit war jede Besucherzahl der
# Auswertung mit einer Zeile curl frei erfindbar — und die Drosselung
# unten hing an einem Wert, den der Angreifer bei jeder Anfrage neu wählt.
#
# dienst/src/server.mjs nimmt in netzVon() seit jeher den letzten und hat
# den Widerspruch als offenen Punkt vermerkt. Jetzt nehmen beide denselben.
map $http_x_forwarded_for $adresse_echt {
    # Mehrere Einträge: der letzte.
    "~,\s*(?<letzte>[^,\s]+)\s*$"    $letzte;
    # Genau einer: der.
    "~^\s*(?<einzige>[^,\s]+)\s*$"   $einzige;
    # Gar keiner — interne Sonden, direkter Zugriff. Dann die Verbindung
    # selbst; hinter dem Ingress ist das der Proxy, aber besser als nichts.
    default                             $remote_addr;
}

map $adresse_echt $besucher {
    # IPv4: letztes Oktett weg.
    "~^(?<vorn>\d{1,3}\.\d{1,3}\.\d{1,3})\."   "$vorn.0";
    # IPv6: alles hinter dem ersten Block weg — dort steckt das Gerät.
    "~^(?<praefix>[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}):"  "$praefix::";
    default                                     "-";
}

log_format gekuerzt escape=json
    '{"zeit":"$time_iso8601","besucher":"$besucher","verfahren":"$request_method",'
    '"pfad":"$uri","status":"$status","bytes":"$body_bytes_sent",'
    '"verweis":"$http_referer","browser":"$http_user_agent",'
    '"dauer":"$request_time"}';

# ── Fehlerberichte ──────────────────────────────────────────────────
#
# Ein eigener Weg statt Sentry oder GlitchTip, und das aus einem Grund:
# Container Apps leitet die Konsolenausgabe dieses Containers ohnehin nach
# Log Analytics — dieselbe Ressourcengruppe, dieselbe Region, die ersten 5 GB
# im Monat frei. Ein Bericht muss also nur ins Protokoll, und schon liegt er
# in eurem eigenen Mandanten in Deutschland.
#
# Was das erspart: einen zweiten Dienst, eine Anmeldung, eine Registrierung im
# Verzeichnis (die ein Gastkonto ohnehin nicht anlegen darf) — und vor allem
# die Übermittlung an einen Dritten samt allem, was daran datenschutzrechtlich
# hängt. Es gibt keinen Dritten.
#
# Der Kunstgriff: nginx füllt `$request_body` nur, wenn die Anfrage
# weitergereicht wird. Deshalb geht sie an diesen Server zurück, auf eine
# Adresse, die nur 204 antwortet.
# Alle Werte in Anführungszeichen: `escape=json` maskiert den Inhalt, setzt
# aber keine Anführungszeichen. Ohne sie entstünde kaputtes JSON, sobald ein
# Wert leer ist — und `$content_length` ist es regelmäßig. Der Bericht bleibt
# dadurch eine Zeichenkette und wird beim Auswerten geparst; das ist auch die
# sichere Variante, weil so nichts aus dem Rumpf in die Protokollstruktur
# ausbrechen kann.
log_format fehlerbericht escape=json
    '{"art":"fehlerbericht","zeit":"$time_iso8601","herkunft":"$http_origin",'
    '"laenge":"$content_length","bericht":"$request_body"}';

# ── Reichweitenmessung ──────────────────────────────────────────────
#
# Derselbe Griff wie beim Fehlerbericht, aus demselben Grund: Die
# Konsolenausgabe dieses Containers geht ohnehin nach Log Analytics, in
# dieselbe Ressourcengruppe, dieselbe Region, die ersten 5 GB im Monat frei.
# Ein Ereignis muss also nur ins Protokoll.
#
# WARUM DAS OHNE EINWILLIGUNG GEHT: § 25 TDDDG verlangt eine Einwilligung fürs
# Speichern auf dem Endgerät und fürs Auslesen von dort. Beides passiert nicht
# — kein Plätzchen, keine Kennung, keine Wiedererkennung. Es bleibt die DSGVO,
# und die trägt das über Art. 6 Abs. 1 lit. f: zu wissen, ob die Seite benutzt
# wird und ob die Sender laufen.
#
# WARUM HIER WEDER DIE ADRESSE NOCH DER SPRACHKOPF STEHT
#
# Beides stand einmal drin, und beides wirkte für sich harmlos. Zusammen mit
# dem Zugriffsprotokoll war es das nicht:
#
#   $besucher — Mess- und Zugriffszeilen liegen in DERSELBEN Tabelle mit
#   DEMSELBEN Feld. Zwei Zeilen Abfragesprache hängen damit an jedes
#   gemeldete Ereignis die volle Browserkennung und die Verweisquelle aus
#   dem Zugriffsprotokoll. Die Messung hätte keine eigene Kennung gebraucht
#   — sie hätte eine geerbt.
#
#   $http_accept_language — das ist nicht das Kürzel, sondern die volle
#   gewichtete Liste, "de-DE,de;q=0.9,en-US;q=0.8,ja;q=0.7". Sie ist einer
#   der stärksten Fingerabdrücke, die ein Browser ungefragt mitschickt.
#
# Der naheliegende Ersatz wäre $sprache gewesen — ein Kürzel aus sieben statt
# der ganzen Liste. Der trägt hier aber nicht: $sprache liest zuerst
# $cookie_hz_sprache. Dieses Cookie ist für die Sprachweiche unbedingt
# erforderlich und deshalb nach § 25 Abs. 2 Nr. 2 TDDDG einwilligungsfrei —
# für die Messung wäre es ein ZWEITER Zweck, und dafür trägt die Ausnahme
# nicht. Wer es trotzdem ausliest, greift auf Informationen im Endgerät zu
# und braucht eine Einwilligung.
#
# Also gar kein Sprachfeld an dieser Stelle. Der Browser schickt das Kürzel
# jetzt selbst im Rumpf mit, gewonnen aus dem PFAD (/de/, /fr/ …) — der steht
# in der Adresszeile, nicht im Gerätespeicher. Siehe assets/lib/messung.mjs.
#
# Keine der Auswertungsfragen verliert dadurch etwas. Die Bezugsgröße für
# die Startquote kommt aus dem Zugriffsprotokoll, die Starts sind eine reine
# Zählung — kein dcount, nirgends.
#
# Bewusst ebenfalls NICHT im Format: welcher Sender wie lange läuft, wonach
# gesucht wurde, und alles, woraus sich eine Person wiedererkennen ließe.
log_format messung escape=json
    '{"art":"messung","zeit":"$time_iso8601","ereignis":"$request_body"}';

# Höchstens ein Bericht je Sekunde und Adresse. Ein Fehler in einer Schleife
# soll das Protokoll nicht fluten — und die Kosten nicht.
#
# $adresse_echt und nicht $binary_remote_addr: Hinter dem Ingress ist
# $remote_addr dessen interne Adresse, und die teilen sich ALLE Besucher.
# Die Begrenzung war damit keine je Person, sondern eine gemeinsame — ein
# einzelner Blätterer hätte sie für alle anderen aufbrauchen können, und
# ein einzelner Angreifer wäre nie an eine eigene Grenze gestoßen.
#
# Der Schlüssel ist jetzt eine Zeichenkette statt vier Bytes, also passen
# weniger Zustände in dieselbe Fläche. Deshalb 4m statt 1m: rund 40 000
# Adressen im Auge, mehr als dieser Laden je gleichzeitig sieht.
limit_req_zone $adresse_echt zone=fehler:4m rate=1r/s;

# Messungen dürfen häufiger kommen als Fehlerberichte: Wer durch die Regale
# blättert, löst in einer Minute leicht ein Dutzend aus. Zehn je Sekunde mit
# Puffer für zwanzig deckt das ab und deckelt zugleich einen Endlosläufer.
limit_req_zone $adresse_echt zone=messung:4m rate=10r/s;

server {
    listen 8080 default_server;
    server_name iyambae.fm www.iyambae.fm _;
    root /srv/radio;
    index index.html;

    # Umleitungen ohne Schema und Hostnamen ausliefern, also "/de/" statt
    # "http://…/de/". Sonst baut nginx die Adresse aus seinem eigenen
    # Lauschport zusammen — hinter dem Proxy von Container Apps waere das
    # "http://iyambae.fm:8080/de/", und der Port ist von aussen zu. Gemessen:
    # genau diese Adresse stand in der Location-Kopfzeile.
    absolute_redirect off;

    access_log /dev/stdout gekuerzt;

    # ── Die Sprachweiche ────────────────────────────────────────────
    #
    # 302, nicht 301. Ein dauerhafter Umzug wird vom Browser gespeichert und
    # gilt dann für immer — wer einmal mit englischem Browser auf /en/ landet
    # und danach umstellt, käme nie wieder woanders hin, weil / gar nicht mehr
    # angefragt wird. Das Ziel hängt von einem Kopfzeilenwert ab; solche
    # Antworten dürfen nicht dauerhaft sein.
    #
    # Vary sagt jedem Zwischenspeicher, dass diese Antwort von Accept-Language
    # abhängt. Ohne die Zeile könnte ein Zwischenspeicher die Antwort für den
    # ersten Besucher allen anderen vorsetzen.
    location = / {
        add_header Vary "Accept-Language, Cookie" always;
        add_header Cache-Control "no-store" always;
        return 302 /$sprache/$is_args$args;
    }

    # Alte Lesezeichen und Kurzbefehle: /index.html?los=nadel gab es vor der
    # Umstellung. Der Suchteil muss mit, sonst landet der Kurzbefehl "Nadel
    # fallen lassen" auf der Startseite.
    location = /index.html {
        add_header Vary "Accept-Language, Cookie" always;
        return 302 /$sprache/$is_args$args;
    }

    # Die Sprachseiten selbst. try_files mit dem eigenen Ordner: /de/beliebig
    # landet auf /de/index.html, nicht auf der deutschen Wurzelseite.
    location ~ ^/(de|en|fr|es|it|ja|ar)(/|$) {
        try_files $uri $uri/ /$1/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /fehler {
        limit_req zone=fehler burst=3 nodelay;
        limit_except POST { deny all; }
        client_max_body_size 8k;          # ein Bericht, kein Datenstrom
        client_body_buffer_size 8k;
        access_log /dev/stdout fehlerbericht;
        proxy_pass http://127.0.0.1:8080/fehler-abgelegt;
    }

    # ── Der Anmeldedienst ───────────────────────────────────────────
    #
    # Er läuft als zweiter Container in DERSELBEN Replik, also unter
    # 127.0.0.1. Deshalb gibt es hier keinen fremden Ursprung, kein CORS und
    # keinen Vorabflug — dasselbe Muster wie beim Fehlerbericht oben.
    #
    # `no-store` ist hier keine Vorsichtsmaßnahme, sondern Pflicht: Die Karte
    # $cache_regel gibt für application/json die Vorgabe "public,
    # max-age=3600" aus. Eine Merkliste, die eine Stunde in einem Firmenproxy
    # liegt, bekäme der nächste Besucher vorgesetzt.
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Der Dienst nimmt den LETZTEN Eintrag der Liste, nicht den ersten:
        # Der Browser darf X-Forwarded-For selbst mitschicken, und Azure hängt
        # nur hinten an. Wer den ersten nimmt, lässt sich die Drossel
        # aushebeln.
        proxy_read_timeout 30s;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Schläft der Sidecar oder startet er neu, antwortet nginx sonst mit
        # einer HTML-Seite — und das Programm auf der Seite versuchte, sie als
        # JSON zu lesen. Ein sauberes JSON sagt stattdessen, was los ist.
        proxy_intercept_errors on;
        error_page 502 503 504 = @dienst_schlaeft;
    }

    location @dienst_schlaeft {
        # default_type, nicht add_header: add_header ERGÄNZT eine Kopfzeile,
        # es ersetzt keine. Gemessen stand Content-Type zweimal in der
        # Antwort — einmal application/octet-stream von nginx, einmal
        # application/json von mir. Ein Browser darf sich dann aussuchen,
        # welche gilt.
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        return 503 '{"fehler":"dienst_schlaeft"}';
    }

    location = /messung {
        limit_req zone=messung burst=20 nodelay;
        limit_except POST { deny all; }
        # Ein Ereignis ist ein paar Dutzend Bytes. 1k ist reichlich und
        # verhindert, dass jemand das Protokoll als Ablage benutzt.
        client_max_body_size 1k;
        client_body_buffer_size 1k;
        access_log /dev/stdout messung;
        proxy_pass http://127.0.0.1:8080/fehler-abgelegt;
    }

    # Ziel der Weiterreichung. Antwortet nur, damit `$request_body` gefüllt ist.
    #
    # Bewusst NICHT `internal`: `proxy_pass` stellt eine neue HTTP-Anfrage,
    # und die kommt von außen — eine als intern markierte Adresse antwortet
    # ihr mit 404. Gemessen: erst 404, nach dem Entfernen 204. Erreichbar ist
    # sie damit theoretisch auch direkt, aber sie tut nichts als 204 zu
    # antworten.
    # Die Bereitschaftsprüfung von Azure.
    #
    # Sie fragte bis hierher `/` ab, alle 10 Sekunden, je Replikat. Das hatte
    # zwei Haken: `/` ist die Sprachweiche und antwortet 302, und jeder dieser
    # Aufrufe stand als Besuch im Zugriffsprotokoll. Bei drei Replikaten waren
    # das rund 26 000 erfundene Besuche am Tag — genau die Zahl, gegen die die
    # Startquote gerechnet wird.
    #
    # Also eine eigene Adresse: 200 statt 302, und nicht protokolliert.
    location = /gesund {
        access_log off;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "gesund
";
    }

    location = /fehler-abgelegt {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    add_header Cache-Control $cache_regel always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # sw.js nie zwischenspeichern: Er ist die Datei, die alle anderen
    # Fassungen steuert.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Sender-Logos und Schriften ändern sich praktisch nie. Die Schriften
    # liegen seit dem Umzug von Google Fonts im eigenen Haus; ihre Namen
    # tragen die Kennung der Fassung, ein Austausch ändert also den Namen.
    # Deshalb darf hier `immutable` stehen.
    location ~* ^/assets/(logos?|schrift)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Alles Uebrige: erst als Datei versuchen, dann an die Sprachweiche.
    # Frueher stand hier `/index.html` als Auffang — das lieferte die deutsche
    # Wurzelseite unter jeder unbekannten Adresse aus, samt Status 200. Eine
    # unbekannte Adresse ist jetzt eine Umleitung an die Wurzel, und die
    # entscheidet ueber die Sprache.
    # /.well-known/ — Nachweise fuer fremde Stellen, keine Seiten.
    #
    # ^~ statt eines einfachen Praefixes: Damit gewinnt dieser Block gegen
    # jede regulaere Weiche darunter, ohne dass die Reihenfolge zaehlt.
    #
    # Der Grund ist Apple. Wer "Anmelden mit Apple" einrichtet, laedt dort
    # eine Datei herunter und muss sie unter
    # /.well-known/apple-developer-domain-association.txt ausliefern; Apple
    # holt sie ab und lehnt die Domaene ab, wenn etwas anderes kommt als der
    # blanke Inhalt. Ohne diesen Block faellt der Pfad in `location /`, von
    # dort in @sprachweiche — und Apple bekaeme eine 302 auf /de/. Der Fehler
    # waere aus der Fehlermeldung heraus kaum zu erraten.
    #
    # =404 und ausdruecklich NICHT die Sprachweiche: Eine fehlende Datei muss
    # hier "gibt es nicht" heissen. Eine Umleitung waere die schlechtere
    # Antwort, weil sie nach Erfolg aussieht.
    #
    # text/plain als Vorgabe, weil die Nachweisdateien keine Endung tragen,
    # die nginx kennt, und mancher Abholer auf dem Typ besteht.
    location ^~ /.well-known/ {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ @sprachweiche;
    }

    location @sprachweiche {
        add_header Vary "Accept-Language, Cookie" always;
        return 302 /$sprache/;
    }
}

server {
    listen 8080;
    server_name apps.iyambae.fm;
    root /srv/apps;
    index index.html;

    access_log /dev/stdout gekuerzt;

    add_header Cache-Control $cache_regel always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Die Programmdateien.
    #
    # Warum hier und nicht als GitHub-Veroeffentlichung: Das Repository ist
    # privat, und Anhaenge einer Veroeffentlichung sind es dann auch —
    # gemessen, ein Abruf ohne Anmeldung bekommt 404. Eine Schaltflaeche,
    # die auf 404 zeigt, ist schlimmer als keine.
    #
    # attachment und nicht inline: Ein .dmg oder .zip soll im Ordner landen,
    # nicht im Browserfenster. Und kein Zwischenspeicher ueber Tage — wer
    # eine neue Ausgabe holt, soll die neue bekommen.
    #
    # Wenn die Dateien einmal groesser werden als ein paar Megabyte, gehoeren
    # sie in einen Blob-Speicher statt ins Abbild. Bei einem Megabyte waere
    # das heute mehr Maschinerie als Nutzen.
    location /herunterladen/ {
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Content-Type-Options "nosniff" always;
        types {
            application/x-apple-diskimage  dmg;
            application/gzip               gz;
            application/zip                zip;
            text/plain                     txt;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
