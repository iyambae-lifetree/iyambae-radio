# Sicherheitskoepfe fuer iyambae.fm (432hz-radio#44). Jeder Block im
# Radio-server, der ein eigenes add_header traegt, laedt diese Datei —
# warum, steht in gemeinsam.conf.

include koepfe/gemeinsam.conf;

# Die Richtlinie, zuerst NUR BERICHTEND. Verstoesse stehen in der Konsole
# des Browsers, gesperrt wird nichts. Schaerfen heisst: den Namen auf
# Content-Security-Policy aendern, sonst nichts.
#
# Jede Quelle hat einen Grund im Code:
#   script-src 'self'            app.js und assets/lib/ — kein Inline-Skript,
#                                kein on…=-Handler (der Test prueft das an
#                                allen gebauten Seiten)
#              'wasm-unsafe-eval' der Signalkern: retuner-worklet.js baut
#                                WebAssembly.Module im AudioWorklet, und
#                                Worklets erben diese Richtlinie
#   style-src 'unsafe-inline'    style="…" im Markup und in den Template-
#                                Strings von app.js
#   img-src https: data: blob:   Senderbilder liegen im Haus; https: haelt
#                                Platz fuer Huellen aus den Titeldiensten
#   media-src https: blob: data: 191 Sender, jeder auf eigenem Host, alle
#                                https (data/sender.json). blob: ist der
#                                MediaSource-Strom, ueber den hls.js spielt;
#                                data: dessen leere Textspur fuer ID3-Titel
#                                (`track.src = "data:,WEBVTT"`) — gemessen,
#                                ohne data: meldet Chrome bei jedem HLS-Sender
#                                einen Verstoss
#   connect-src https:           hls.js holt Listen und Stuecke per XHR,
#                                titel.mjs fragt somafm, laut.fm, radio.co,
#                                radioking und zeno (EventSource)
#               127.0.0.1:47432  myretuner.mjs, der Tuner auf diesem Rechner
#   worker-src blob:             hls.js startet seinen Arbeiter aus blob:;
#                                'self' fuer sw.js
#   form-action 'self'           Die Formulare der Anmeldung schicken per
#                                fetch. Google und Apple sind Verweise
#                                (href), keine Formularziele.
#   frame-ancestors 'none'       wirkt erst scharf; bis dahin X-Frame-Options
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; media-src 'self' https: blob: data:; connect-src 'self' https: http://127.0.0.1:47432; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
