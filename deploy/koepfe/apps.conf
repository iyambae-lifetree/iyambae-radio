# Sicherheitskoepfe fuer apps.iyambae.fm (432hz-radio#44). Jeder Block im
# Apps-server, der ein eigenes add_header traegt, laedt diese Datei —
# warum, steht in gemeinsam.conf.

include koepfe/gemeinsam.conf;

# Die Richtlinie, zuerst NUR BERICHTEND, wie beim Radio.
#
# Enger als beim Radio: Hier spielt kein fremder Strom, und nichts wird
# von einem fremden Host geholt. Medien, Verbindungen und Bilder: nur das
# eigene Haus.
#
# DIE HASHES. Die Seite hat fuenf Inline-Skripte — drei in index.html (die
# Systemerkennung im Kopf, der Schwebungsmesser, die Umfrage), je eins in
# hoertest.html und stimmung.html. Die Bauskripte lassen sie in allen
# sieben Sprachen unveraendert; nachgemessen an den gebauten Seiten, 8
# Fundstellen je Hash. Erlaubt ist also genau dieser Text, kein anderer.
#
# WER EIN INLINE-SKRIPT AENDERT, aendert seinen Hash. Dann bricht der Bau
# in Scripts/test/sicherheitskoepfe.test.mjs ab und nennt den neuen —
# hier eintragen, den alten streichen. Auslagern waere die andere Loesung;
# fuer die Systemerkennung im Kopf geht das nicht ohne sichtbares Umbauen.
#
# 'wasm-unsafe-eval': Hoertest und Probe laden denselben Signalkern im
# AudioWorklet wie das Radio.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-wiIIH9vlbIx4QpdGkUrBIanTHWnwwh/WD08tthGr7wU=' 'sha256-FJXbIaE2R2nOEd3ddG+GXEedRtkocpUmx66TuHdO/j0=' 'sha256-TTe5WgktuXMNs0iU1hvcY/iUmfIB3QNyErU7lvWvrW8=' 'sha256-5Jmyu7EcINk5QXXH5/+8yv1LRFKtEydpqk/uW3jDzoQ=' 'sha256-MfCuObgLtRXt7AUtE1ewUoi0661pEI7d1cBIsoPMAMM='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
