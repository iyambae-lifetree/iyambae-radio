# Sicherheitskoepfe fuer beide Hostnamen (432hz-radio#44).
#
# NICHT direkt laden — radio.conf und apps.conf ziehen diese Datei herein und
# setzen danach die Richtlinie ihres Hostnamens.
#
# WARUM EINE DATEI UND KEIN add_header AUF SERVEREBENE ALLEIN: nginx erbt
# add_header nur, wenn ein Block selbst KEINES setzt. Ein einziges
# `add_header Cache-Control …` in einem location-Block wirft alle Koepfe der
# Ebene darueber weg, still. Gemessen am 01.10.2026: nosniff und
# Referrer-Policy fehlten auf allen HTML-Seiten von apps.iyambae.fm, bei
# Logos, Schriften, /sw.js, robots.txt, sitemap.xml und /.well-known/.
# Jeder Block mit eigenem add_header laedt deshalb seine Datei per include;
# Scripts/test/sicherheitskoepfe.test.mjs prueft das Block fuer Block.
#
# Liegt im Abbild unter /etc/nginx/koepfe/, NICHT unter conf.d/: Was dort
# liegt, laedt nginx von selbst auf http-Ebene — dann stuende die
# Richtlinie des Radios auch ueber der Apps-Seite.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Ein Jahr, mit Unterdomaenen, ohne preload. preload ist eine Liste in den
# Browsern selbst und kaum zurueckzunehmen; erst, wenn das hier eine Weile
# ohne Ueberraschung laeuft. Ueber http (lokal, hinter dem Ingress) liest
# ein Browser die Zeile nicht — sie zaehlt nur ueber https, und dorthin
# leitet der Ingress von Container Apps ohnehin um.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Einbettungsschutz SOFORT scharf, auch wenn die Richtlinie noch Report-Only
# ist: frame-ancestors greift dort nicht. Nichts im Bestand bettet eine
# dieser Seiten ein (kein iframe, nirgends) — die Klickfalle auf
# „Anmelden" und „Konto loeschen" ist damit zu.
add_header X-Frame-Options "DENY" always;

# Was keine Seite hier benutzt. Kein getUserMedia, keine Ortung, keine
# Zahlung im Bestand; die Tonhoehe misst der Tuner auf dem Rechner, nicht
# der Browser. Passkeys (publickey-credentials-*) bleiben bei der Vorgabe
# 'self' und stehen deshalb nicht hier.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
